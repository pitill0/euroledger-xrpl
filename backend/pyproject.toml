[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euroledger-xrpl-backend"
version = "0.1.0"
description = "Backend service for EuroLedger XRPL proof of concept."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "EuroLedger XRPL contributors" }
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "alembic>=1.13.0,<2.0.0",
    "xrpl-py>=4.5.0,<5.0.0",
    "prometheus-client>=0.21.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[project.scripts]
xrpl-worker = "app.commands.xrpl_worker:main"
payment-intent-expirer = "app.commands.payment_intent_expirer:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
