name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend quality checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm active workflow version
        run: |
          echo "RUNNING GITEA BACKEND CI WITHOUT SETUP-PYTHON"
          pwd
          ls -la

      - name: Show versions
        run: |
          python --version
          node --version
          git --version

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff lint
        run: |
          ruff check app tests

      - name: Run Ruff format check
        run: |
          ruff format --check app tests

      - name: Run tests
        run: |
          pytest
