services:
  wordpress:
    image: ${WORDPRESS_IMAGE:-wordpress:latest}
    container_name: euroledger-wp-dev
    restart: unless-stopped
    ports:
      - "${WORDPRESS_PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-euroledger_wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-euroledger_wp_password}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-euroledger_wp}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
    volumes:
      - wordpress_data:/var/www/html
      - ../euroledger-xrpl-gateway:/var/www/html/wp-content/plugins/euroledger-xrpl-gateway
    depends_on:
      - db

  db:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: euroledger-wp-db-dev
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-euroledger_wp}
      MARIADB_USER: ${WORDPRESS_DB_USER:-euroledger_wp}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-euroledger_wp_password}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-euroledger_wp_root_password}
    volumes:
      - db_data:/var/lib/mysql

  wp-cli:
    image: ${WP_CLI_IMAGE:-wordpress:cli}
    profiles:
      - tools
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-euroledger_wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-euroledger_wp_password}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-euroledger_wp}
    volumes:
      - wordpress_data:/var/www/html
      - ../euroledger-xrpl-gateway:/var/www/html/wp-content/plugins/euroledger-xrpl-gateway
    depends_on:
      - db
      - wordpress

volumes:
  wordpress_data:
  db_data:
