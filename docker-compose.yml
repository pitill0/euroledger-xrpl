services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: euroledger-xrpl-backend
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/fixtures:/app/fixtures
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready').read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - postgres
    restart: unless-stopped

  xrpl-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: euroledger-xrpl-worker
    command:
      - xrpl-worker
      - --testnet
      - --limit
      - "${XRPL_WORKER_LIMIT:-20}"
      - --poll-interval
      - "${XRPL_WORKER_POLL_INTERVAL:-30}"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/fixtures:/app/fixtures
    depends_on:
      - postgres
    restart: unless-stopped

  payment-intent-expirer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: euroledger-payment-intent-expirer
    command:
      - payment-intent-expirer
      - --limit
      - "${PAYMENT_INTENT_EXPIRER_LIMIT:-100}"
      - --poll-interval
      - "${PAYMENT_INTENT_EXPIRER_POLL_INTERVAL:-60}"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/fixtures:/app/fixtures
    depends_on:
      - postgres
    restart: unless-stopped

  webhook-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: euroledger-webhook-worker
    command:
      - webhook-worker
      - --limit
      - "${WEBHOOK_WORKER_LIMIT:-100}"
      - --timeout
      - "${WEBHOOK_WORKER_TIMEOUT:-10}"
      - --max-attempts
      - "${WEBHOOK_WORKER_MAX_ATTEMPTS:-5}"
      - --poll-interval
      - "${WEBHOOK_WORKER_POLL_INTERVAL:-30}"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/fixtures:/app/fixtures
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: euroledger-xrpl-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-euroledger}
      POSTGRES_USER: ${POSTGRES_USER:-euroledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-euroledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-euroledger} -d ${POSTGRES_DB:-euroledger}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: euroledger-xrpl-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: euroledger-xrpl-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    depends_on:
      - prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    container_name: euroledger-xrpl-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - alertmanager
    restart: unless-stopped

  n8n:
    #image: docker.n8n.io/n8nio/n8n:2.25.7
    image: n8nio/n8n:2.25.7
    container_name: euroledger-xrpl-n8n
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Madrid}
      TZ: ${GENERIC_TIMEZONE:-Europe/Madrid}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  n8n_data:
