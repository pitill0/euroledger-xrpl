services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: euroledger-xrpl-backend
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/fixtures:/app/fixtures
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - postgres
    restart: unless-stopped

  xrpl-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: euroledger-xrpl-worker
    command:
      - xrpl-worker
      - --testnet
      - --limit
      - "${XRPL_WORKER_LIMIT:-20}"
      - --poll-interval
      - "${XRPL_WORKER_POLL_INTERVAL:-30}"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/fixtures:/app/fixtures
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: euroledger-xrpl-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-euroledger}
      POSTGRES_USER: ${POSTGRES_USER:-euroledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-euroledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euroledger -d euroledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
